function getMetrics(){
 let raw=scenarios[state.country][state.method];let t=raw.t,s=raw.s,base=raw.baseline;
 let androidT,androidS,webT,webS;
 const isFocus=state.country==='DE'&&state.method==='Klarna';
 if(isFocus){androidT=1000;androidS=850;webT=1000;webS=934;}
 else{androidT=Math.round(t*.5);webT=t-androidT;let rate=s/t;androidS=Math.round(androidT*Math.max(.5,rate-.006));webS=s-androidS;}
 if(state.period!=='24h'){
  let mult=state.period==='7d'?7:30;
  t=Math.round(t*mult*(state.period==='7d'?1.01:1.04));
  const periodRate=isFocus?(state.period==='7d'?.935:.943):(s/raw.t + (state.period==='7d'?.002:.003));
  s=Math.round(t*periodRate);
  androidT=Math.round(t*.5);webT=t-androidT;
  androidS=Math.round(androidT*(periodRate-(isFocus?.012:.005)));
  webS=s-androidS;
  base=isFocus?(state.period==='7d'?95.1:95.0):raw.baseline;
 }
 let rows={all:{t,s},Android:{t:androidT,s:androidS},Web:{t:webT,s:webS}};
 const v=rows[state.channel];
 let adjustedBase=base;
 if(state.channel==='Android')adjustedBase=base-0.5;
 if(state.channel==='Web')adjustedBase=base+0.5;
 let rate=v.t? v.s/v.t*100:0;
 let diff=rate-adjustedBase;
 return {isFocus,t:v.t,s:v.s,fail:v.t-v.s,rate,baseline:adjustedBase,diff,rows,isAlert:isFocus&&state.period==='24h'&&state.channel==='all',androidRate:androidS/androidT*100,webRate:webS/webT*100};
}

 return [m.baseline-.2,m.baseline+.15,m.baseline-.25,m.baseline+.1,m.baseline-.4,(m.baseline+m.rate)/2,m.rate].map(v=>Math.min(99.5,v));
}

 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
 const fill=line+` L${x(6)},${h-padB} L${x(0)},${h-padB} Z`;

 return `<svg role="img" aria-label="支付成功率趋势，当前 ${pct(m.rate)}，基准 ${pct(m.baseline)}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="lineFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5f9ff9" stop-opacity=".2"/><stop offset="100%" stop-color="#5f9ff9" stop-opacity="0"/></linearGradient></defs>${grid}${xs}<line x1="${padL}" x2="${w-padR}" y1="${y(m.baseline)}" y2="${y(m.baseline)}" stroke="#b9c9db" stroke-width="1.5" stroke-dasharray="6 7"/><path d="${fill}" fill="url(#lineFill)"/><path d="${line}" fill="none" stroke="#397bea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===6?5:3.6}" fill="#fff" stroke="#397bea" stroke-width="2"><title>${xs[i].match(/>.*</)?.[0]||'日期'} ${pct(data[i])}</title></circle>`).join('')}<g transform="translate(${Math.max(44,x(6)-55)},${Math.max(4,y(data[6])-35)})"><rect x="0" y="0" width="62" height="23" rx="7" fill="#2b6dce"/><text x="31" y="16" fill="white" font-size="12" text-anchor="middle" font-weight="700">${pct(data[6])}</text></g></svg>`;
}

  state.taskStep++;
  if(state.taskStep>=stepNames.length){clearInterval(state.timer);state.timer=null;
   if(fullCase){state.chatStatus='completed';addBot(`<strong>${I('check','sm')} 模拟诊断完成：已找到需要优先排查的异常线索。</strong><p><b>统计事实：</b>德国 Klarna 最近 24 小时成功率从基准 95.0% 降至 89.2%（-5.8pp），2,000 次有效尝试中成功 1,784 次。</p><p><b>异常集中：</b>Android 成功率 85.0%，Web 为 93.4%；Android 150 次失败中有 90 次标记为 redirect_timeout。</p><p><b>诊断假设：</b>优先检查 Android 回跳流程与客户端版本关联；当前还不能确认根因。知识引用：[KB-001]、[KB-002]。</p><button class="btn primary small" data-nav="report">查看完整报告 ${I('arrow','sm')}</button> <button class="btn small" data-prompt="version">追问：是否与新版有关？</button>`);}
   else{state.chatStatus='insufficient';addBot(`<strong>已完成模拟指标查询，但缺少可支持具体根因的证据。</strong><p>当前范围：${safe(labels[dc])} / ${safe(dm)} / ${dp}。本原型只为“德国 / Klarna / 最近 24 小时”准备了完整的模拟异常、错误码与知识证据链。其他组合仅可查看统计模拟值，不能输出可靠原因。</p><p>可以在支付总览中切换到预置案例，或补充该组合的错误分布与链路日志后继续诊断。</p><button class="btn small" data-action="use-demo-case">使用完整演示案例 ${I('arrow','sm')}</button>`);}
  }
  render();
 },520);
}
function getReportText(){return `# PayPilot AI 诊断报告 · DEMO-2026-001\n\n> 全部内容为模拟数据。初步诊断，根因未确认。\n\n- 地区：德国；支付方式：Klarna；周期：最近 24 小时\n- 有效尝试：2,000；成功：1,784；失败：216\n- 当前 PSR：89.2%；基准 PSR：95.0%；变化：-5.8pp\n- Android：1,000 次有效尝试，850 次成功，85.0%\n- Web：1,000 次有效尝试，934 次成功，93.4%\n- Android 失败 150 次，其中 redirect_timeout 90 次（60%）\n\n## 初步判断\nAndroid 端回跳链路是优先核查方向；不能确认版本变更或 SDK 是根因。\n\n## 建议行动\n1. 对比基准期 redirect_timeout 分布。\n2. 下钻 Android 版本与流量结构。\n3. 检查 Deep Link、WebView 和终态同步。\n4. 与研发协同复核，禁止自动修改生产配置。\n\n## 知识引用\n- [KB-001] Android WebView / Deep Link 回跳排查清单（自编模拟文档）\n- [KB-002] redirect_timeout 标准化错误码说明（自编模拟文档）\n\n数据来源：mock-payments-v1；快照：2026-11-16 18:00 UTC+8。`}
function doCopy(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('内容已复制到剪贴板')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();try{if(document.execCommand('copy'))toast('内容已复制到剪贴板');else toast('浏览器限制复制，可手动选择文本');}catch(e){toast('复制受限，请手动选择文本')}t.remove();}
function downloadReport(){const blob=new Blob([getReportText()],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PayPilot_AI_模拟诊断报告.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示报告 Markdown');}
function showGuide(){const d=document.createElement('div');d.id='guideModal';d.style.cssText='position:fixed;z-index:140;inset:0;background:rgba(12,23,41,.55);display:grid;place-items:center;padding:20px';d.innerHTML=`<div role="dialog" aria-modal="true" aria-label="原型使用说明" style="max-width:510px;width:100%;background:#fff;border-radius:17px;padding:27px 30px;box-shadow:0 24px 70px rgba(0,0,0,.2);color:#2d455f"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:18px">原型体验指南</strong><button class="circle-btn" id="closeModal" aria-label="关闭">${I('x')}</button></div><p style="font-size:12px;line-height:1.85;color:#687f9b">这是纯离线、高保真可交互原型；所有数字和 AI 执行步骤均为预置模拟。产品不连接真实支付系统或大模型。</p><ol style="font-size:12px;line-height:2.1;padding-left:20px;color:#526a85"><li>在「支付总览」体验国家、支付方式、终端和周期筛选。</li><li>恢复德国 / Klarna / 最近 24 小时，点击「开始 AI 诊断」。</li><li>观察模拟 Workflow，然后进入「诊断报告」查看数据证据与知识引用。</li><li>尝试连续追问、提交反馈，并在「知识库」和「评测中心」检查完整设计。</li></ol><p style="font-size:11px;color:#a17d51;background:#fff8ed;padding:10px;border-radius:8px">注意：此原型可验证体验流程，但不能代表 AI 诊断准确率、支付效果或真实评测结果。</p><button class="btn primary" id="guideGo" style="width:100%;margin-top:11px">体验预置支付异常场景</button></div>`;document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d||e.target.closest('#closeModal'))d.remove();if(e.target.closest('#guideGo')){d.remove();state.country='DE';state.method='Klarna';state.channel='all';state.period='24h';navigate('dashboard')}});}
// Delegated click and change actions keep the prototype self-contained.
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
 const doc=e.target.closest('[data-doc]');if(doc){state.kbSelected=doc.dataset.doc;state.kbSearch='';state.kbFilter='全部';navigate('knowledge');return;}
 const filter=e.target.closest('[data-kbfilter]');if(filter){state.kbFilter=filter.dataset.kbfilter;render();return;}
 const tab=e.target.closest('[data-report-tab]');if(tab){state.reportTab=tab.dataset.reportTab;render();return;}
 const quick=e.target.closest('[data-prompt]');if(quick){fromPrompt(quick.dataset.prompt);return;}
 const fb=e.target.closest('[data-feedback]');if(fb){state.feedbackChoice=fb.dataset.feedback;render();return;}
 const btn=e.target.closest('[data-action]');if(!btn)return;
 switch(btn.dataset.action){
  case 'menu': document.getElementById('sidebar').classList.add('open');document.getElementById('shade').classList.add('show');break;
  case 'guide':showGuide();break;
  case 'kb-info':toast('知识库为项目自编演示文档，不含渠道官方数据');break;
  case 'start-focused':startFocused();break;
  case 'reset-filters':state.country='DE';state.method='Klarna';state.channel='all';state.period='24h';render();toast('已恢复德国 Klarna 演示案例');break;
  case 'new-chat':clearInterval(state.timer);state.timer=null;state.messages=[];state.chatStatus='empty';state.taskStep=0;state.draft='';render();break;
  case 'send-diagnosis':{const field=document.getElementById('chatInput');if(field)sendQuery(field.value);break;}
  case 'stop-diagnosis':clearInterval(state.timer);state.timer=null;state.chatStatus='cancelled';addBot('<strong>已停止当前模拟诊断。</strong><p>后续工具步骤已取消；你可以新建对话或重新提问。</p>');render();break;
  case 'clarify-confirm':{state.country=document.getElementById('clarifyCountry').value;state.method=document.getElementById('clarifyMethod').value;state.period=document.getElementById('clarifyPeriod').value;state.channel='all';state.chatStatus='answered';addBot('<p>已确认分析范围，开始执行受控模拟诊断。</p>');sendQuery(`分析${labels[state.country]} ${state.method} ${state.period}支付成功率变化`);break;}
  case 'use-demo-case':state.country='DE';state.method='Klarna';state.period='24h';state.channel='all';sendQuery('分析德国 Klarna 最近 24 小时支付成功率下降的原因');break;
  case 'copy-report':doCopy(getReportText());break;
  case 'download-report':downloadReport();break;
  case 'copy-citation':doCopy(`[${state.kbSelected}] ${kbDocs.find(d=>d.id===state.kbSelected)?.title||''}（模拟文档）`);break;
  case 'submit-feedback':{const choices={good:'正确且有帮助',partial:'部分正确',wrong:'结果错误',unknown:'无法判断'};if(!state.feedbackChoice){toast('请先选择一个反馈选项');break;}const note=document.getElementById('feedbackNote');state.feedbackNote=(note?.value||'').trim();state.feedback={label:choices[state.feedbackChoice],note:state.feedbackNote};try{localStorage.setItem('paypilot-feedback-v1',JSON.stringify(state.feedback))}catch(e){}render();toast('反馈已记录到本地演示状态');break;}
  case 'run-eval':state.evalRan=true;render();toast('已展示 5 条预置的脚本化演示结果（非真实 LLM 评测）');break;
 }
});
document.addEventListener('change',e=>{const filter=e.target.closest('[data-filter]');if(filter){state[filter.dataset.filter]=filter.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='feedbackNote')state.feedbackNote=e.target.value;if(e.target.id==='chatInput')state.draft=e.target.value;if(e.target.id==='kbSearch'){state.kbSearch=e.target.value;const needle=state.kbSearch.trim().toLowerCase();document.querySelectorAll('#kbList .kb-card').forEach(card=>{const doc=kbDocs.find(d=>d.id===card.dataset.doc);card.style.display=(doc.title+doc.desc+doc.tags.join('')+doc.id).toLowerCase().includes(needle)?'':'none'});const list=document.getElementById('kbList');if(list&&list.querySelectorAll('.kb-card:not([style*="display: none"])').length===0&&!list.querySelector('.kb-no-results')){list.insertAdjacentHTML('beforeend','<div class="card empty kb-no-results">没有匹配的演示文档</div>')}else if(list&&list.querySelectorAll('.kb-card:not([style*="display: none"])').length>0){list.querySelector('.kb-no-results')?.remove()}}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQuery(e.target.value)}if(e.key==='Escape'){document.getElementById('guideModal')?.remove();document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')}});
document.getElementById('shade').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('show')});
try{let f=JSON.parse(localStorage.getItem('paypilot-feedback-v1')||'null');if(f&&f.label)state.feedback=f;}catch(e){}
render();
</script>
